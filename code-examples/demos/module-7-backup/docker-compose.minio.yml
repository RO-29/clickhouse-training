# Standalone MinIO. run.sh attaches it to the same docker network as the
# clickhouse-single container so backup-to-S3 works.
#
# Up:   docker compose -f docker-compose.minio.yml up -d
# Down: docker compose -f docker-compose.minio.yml down -v

version: '3.8'

services:
  minio:
    image: minio/minio:latest
    container_name: minio
    hostname: minio
    ports:
      - "9100:9000"
      - "9101:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    command: server /data --console-address ":9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/ready"]
      interval: 10s
      timeout: 5s
      retries: 5
