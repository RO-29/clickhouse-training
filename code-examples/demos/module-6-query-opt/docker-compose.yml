# Module 6: Query optimization — standalone single-node, generously resourced.

services:
  clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: m6-clickhouse
    hostname: m6-clickhouse
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - m6_data:/var/lib/clickhouse
      - m6_logs:/var/log/clickhouse-server
      - ./configs/clickhouse-config.xml:/etc/clickhouse-server/config.d/00-custom.xml:ro
    networks: [m6-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30
    deploy:
      resources:
        limits:
          memory: 6G
    restart: unless-stopped

volumes:
  m6_data:
  m6_logs:

networks:
  m6-net:
    driver: bridge
