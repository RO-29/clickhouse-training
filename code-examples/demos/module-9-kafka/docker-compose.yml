# Module 9: Kafka ingestion — standalone stack (CH + Kafka + ZK + UI).
# Internal hosts: m9-kafka:29092, m9-zk:2181.
# From the host you can hit Kafka at localhost:9092 too (see KAFKA_ADVERTISED_LISTENERS).

services:
  m9-zk:
    image: confluentinc/cp-zookeeper:7.5.0
    container_name: m9-zk
    hostname: m9-zk
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks: [m9-net]
    healthcheck:
      test: ["CMD-SHELL", "echo ruok | nc -w 2 localhost 2181 | grep -q imok"]
      interval: 5s
      timeout: 3s
      retries: 20

  m9-kafka:
    image: confluentinc/cp-kafka:7.5.0
    container_name: m9-kafka
    hostname: m9-kafka
    depends_on:
      m9-zk: { condition: service_healthy }
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: m9-zk:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://m9-kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
    networks: [m9-net]
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s

  m9-clickhouse:
    image: clickhouse/clickhouse-server:latest
    container_name: m9-clickhouse
    hostname: m9-clickhouse
    depends_on:
      m9-kafka: { condition: service_healthy }
    ports:
      - "8123:8123"
      - "9000:9000"
    ulimits:
      nofile: { soft: 262144, hard: 262144 }
    volumes:
      - m9_data:/var/lib/clickhouse
      - m9_logs:/var/log/clickhouse-server
      - ./configs/clickhouse-config.xml:/etc/clickhouse-server/config.d/00-custom.xml:ro
    networks: [m9-net]
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      interval: 5s
      timeout: 3s
      retries: 30

  m9-kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: m9-kafka-ui
    depends_on:
      - m9-kafka
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: m9
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: m9-kafka:29092
      KAFKA_CLUSTERS_0_PROPERTIES_SECURITY_PROTOCOL: PLAINTEXT
    networks: [m9-net]

volumes:
  m9_data:
  m9_logs:

networks:
  m9-net:
    driver: bridge
