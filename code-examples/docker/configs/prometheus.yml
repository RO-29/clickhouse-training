# Prometheus Configuration for ClickHouse Monitoring Stack
# Purpose: Scrape metrics from ClickHouse, Node Exporter, and cAdvisor

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    monitor: 'clickhouse-monitoring'

# Alertmanager configuration
alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093

# Load rules once and periodically evaluate them
rule_files:
  - '/etc/prometheus/alert-rules.yml'

# Scrape configurations
scrape_configs:
  # Prometheus self-monitoring
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  # ClickHouse server metrics
  - job_name: 'clickhouse'
    scrape_interval: 10s
    scrape_timeout: 5s
    static_configs:
      - targets: ['clickhouse-server:8123']
    metrics_path: '/metrics'
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance
      - source_labels: [__scheme__]
        target_label: scheme

  # Node Exporter - system metrics
  - job_name: 'node'
    scrape_interval: 15s
    static_configs:
      - targets: ['node-exporter:9100']
    relabel_configs:
      - source_labels: [__address__]
        regex: '([^:]+)(?::\d+)?'
        replacement: '${1}:9100'
        target_label: __address__
      - target_label: job
        replacement: 'node'

  # cAdvisor - container metrics
  - job_name: 'cadvisor'
    scrape_interval: 15s
    static_configs:
      - targets: ['cadvisor:8080']
    relabel_configs:
      - source_labels: [__address__]
        target_label: instance

  # Alertmanager self-monitoring
  - job_name: 'alertmanager'
    scrape_interval: 15s
    static_configs:
      - targets: ['alertmanager:9093']

  # Service discovery for additional targets (optional)
  # Can be extended with file-based service discovery or other mechanisms
  - job_name: 'file-sd'
    file_sd_configs:
      - files:
          - '/etc/prometheus/sd_configs/*.json'
        refresh_interval: 30s
