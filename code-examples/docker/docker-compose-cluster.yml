volumes:
  # ZooKeeper volumes
  zk_data_1:
  zk_datalog_1:
  zk_data_2:
  zk_datalog_2:
  zk_data_3:
  zk_datalog_3:
  # ClickHouse volumes
  clickhouse_data_s1r1:
  clickhouse_data_s1r2:
  clickhouse_data_s2r1:
  clickhouse_data_s2r2:
  clickhouse_data_s3r1:
  clickhouse_data_s3r2:

networks:
  clickhouse-cluster:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/16
