<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 320" width="720" height="320" font-family="ui-monospace, Menlo, monospace" font-size="13">
  <text x="360" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">
    Same query, three layouts — read_rows tells the truth
  </text>
  <text x="360" y="46" text-anchor="middle" fill="#475569">
    Q2: per-month, per-country aggregation on the same 20M rows
  </text>

  <!-- Y axis label -->
  <text transform="translate(35,180) rotate(-90)" text-anchor="middle" fill="#0f172a" font-size="12">read_rows</text>

  <!-- Three bars, growing on a timer -->
  <!-- BAD ordering: ~20M -->
  <g>
    <text x="160" y="280" text-anchor="middle" fill="#0f172a">BAD ordering</text>
    <text x="160" y="295" text-anchor="middle" fill="#7f1d1d" font-size="11">~20,000,000 rows</text>
    <rect x="120" y="260" width="80" height="0" fill="#7f1d1d">
      <animate attributeName="height" from="0" to="200" dur="1.6s" begin="0s" fill="freeze"/>
      <animate attributeName="y"      from="260" to="60"  dur="1.6s" begin="0s" fill="freeze"/>
    </rect>
  </g>

  <!-- GOOD ordering: ~5M -->
  <g>
    <text x="360" y="280" text-anchor="middle" fill="#0f172a">GOOD ordering</text>
    <text x="360" y="295" text-anchor="middle" fill="#0f766e" font-size="11">~5,000,000 rows</text>
    <rect x="320" y="260" width="80" height="0" fill="#0f766e">
      <animate attributeName="height" from="0" to="50"  dur="1.6s" begin="0.4s" fill="freeze"/>
      <animate attributeName="y"      from="260" to="210" dur="1.6s" begin="0.4s" fill="freeze"/>
    </rect>
  </g>

  <!-- PROJECTION: ~3k -->
  <g>
    <text x="560" y="280" text-anchor="middle" fill="#0f172a">PROJ + skip-idx</text>
    <text x="560" y="295" text-anchor="middle" fill="#1a4480" font-size="11">~3,000 rows</text>
    <rect x="520" y="260" width="80" height="0" fill="#1a4480">
      <animate attributeName="height" from="0" to="2"   dur="1.6s" begin="0.8s" fill="freeze"/>
      <animate attributeName="y"      from="260" to="258" dur="1.6s" begin="0.8s" fill="freeze"/>
    </rect>
    <text x="560" y="252" text-anchor="middle" fill="#1a4480" font-size="10" opacity="0">
      <animate attributeName="opacity" from="0" to="1" dur="0.4s" begin="2.4s" fill="freeze"/>
      ←  here
    </text>
  </g>

  <!-- baseline -->
  <line x1="60" y1="260" x2="660" y2="260" stroke="#0f172a" stroke-width="1.5"/>

  <!-- Continuous loop indicator: re-run -->
  <g>
    <text x="660" y="20" text-anchor="end" fill="#94a3b8" font-size="10">animation re-runs every 4s</text>
    <animate attributeName="opacity" values="1;1;0;0;1" dur="4s" repeatCount="indefinite"/>
  </g>

  <!-- restart by ticking opacity on bars -->
  <rect x="60" y="60" width="600" height="200" fill="white" opacity="0">
    <animate attributeName="opacity" values="0;0;0;1;0" dur="4s" repeatCount="indefinite"/>
  </rect>
</svg>
