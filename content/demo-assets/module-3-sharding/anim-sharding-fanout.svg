<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 360" width="800" height="360" font-family="ui-monospace, Menlo, monospace" font-size="13">
  <defs>
    <linearGradient id="ch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1a4480"/>
    </linearGradient>
  </defs>

  <text x="400" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">
    Distributed insert with cityHash64(user_id)
  </text>
  <text x="400" y="46" text-anchor="middle" fill="#475569">
    rows fan out to one of three shards based on the hash
  </text>

  <!-- Producer / client -->
  <g>
    <rect x="20" y="150" width="120" height="60" rx="8" fill="#0f766e"/>
    <text x="80" y="175" text-anchor="middle" fill="white">Client</text>
    <text x="80" y="195" text-anchor="middle" fill="white" font-size="11">INSERT 5M rows</text>
  </g>

  <!-- Distributed table -->
  <g>
    <rect x="200" y="150" width="170" height="60" rx="8" fill="#7c3aed"/>
    <text x="285" y="175" text-anchor="middle" fill="white">hits_distributed</text>
    <text x="285" y="195" text-anchor="middle" fill="white" font-size="11">cityHash64(user_id) % 3</text>
  </g>

  <!-- Three shards -->
  <g>
    <rect x="600" y="60" width="180" height="60" rx="8" fill="url(#ch)"/>
    <text x="690" y="85" text-anchor="middle" fill="white">m3-s1r1 / s1r2</text>
    <text x="690" y="105" text-anchor="middle" fill="white" font-size="11">~1.67M rows</text>

    <rect x="600" y="150" width="180" height="60" rx="8" fill="url(#ch)"/>
    <text x="690" y="175" text-anchor="middle" fill="white">m3-s2r1 / s2r2</text>
    <text x="690" y="195" text-anchor="middle" fill="white" font-size="11">~1.67M rows</text>

    <rect x="600" y="240" width="180" height="60" rx="8" fill="url(#ch)"/>
    <text x="690" y="265" text-anchor="middle" fill="white">m3-s3r1 / s3r2</text>
    <text x="690" y="285" text-anchor="middle" fill="white" font-size="11">~1.67M rows</text>
  </g>

  <!-- Static lines from client→distributed and distributed→shards -->
  <line x1="140" y1="180" x2="200" y2="180" stroke="#0f172a" stroke-width="2" marker-end="url(#a)"/>
  <line x1="370" y1="170" x2="600" y2="90"  stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="370" y1="180" x2="600" y2="180" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="370" y1="190" x2="600" y2="270" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#0f172a"/>
    </marker>
  </defs>

  <!-- Animated rows traveling along three paths -->
  <g>
    <!-- Row → shard 1 -->
    <circle r="6" fill="#22c55e">
      <animateMotion dur="3s" repeatCount="indefinite" path="M 285 180 L 690 90"/>
    </circle>
    <!-- Row → shard 2 -->
    <circle r="6" fill="#22c55e">
      <animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M 285 180 L 690 180"/>
    </circle>
    <!-- Row → shard 3 -->
    <circle r="6" fill="#22c55e">
      <animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M 285 180 L 690 270"/>
    </circle>
    <!-- More rows on staggered cycles -->
    <circle r="6" fill="#22c55e">
      <animateMotion dur="3s" begin="0.5s" repeatCount="indefinite" path="M 285 180 L 690 270"/>
    </circle>
    <circle r="6" fill="#22c55e">
      <animateMotion dur="3s" begin="1.7s" repeatCount="indefinite" path="M 285 180 L 690 90"/>
    </circle>
  </g>

  <text x="400" y="345" text-anchor="middle" fill="#475569" font-size="11">All events for one user_id always land on the same shard — predictable single-shard reads.</text>
</svg>
