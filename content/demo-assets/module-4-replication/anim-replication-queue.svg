<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 360" width="760" height="360" font-family="ui-monospace, Menlo, monospace" font-size="13">
  <defs>
    <linearGradient id="ch" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b82f6"/>
      <stop offset="100%" stop-color="#1a4480"/>
    </linearGradient>
  </defs>

  <text x="380" y="24" text-anchor="middle" font-size="16" font-weight="bold" fill="#0f172a">
    Replication queue draining after replica restart
  </text>
  <text x="380" y="46" text-anchor="middle" fill="#475569">
    s1r2 was down; queue holds 5 entries; SYSTEM SYNC REPLICA waits for 0
  </text>

  <!-- Replicas -->
  <g>
    <rect x="40" y="80" width="180" height="80" rx="8" fill="url(#ch)"/>
    <text x="130" y="105" text-anchor="middle" fill="white" font-weight="bold">m4-s1r1</text>
    <text x="130" y="125" text-anchor="middle" fill="white" font-size="11">writer</text>
    <text x="130" y="145" text-anchor="middle" fill="white" font-size="11">parts: 2.5M rows</text>

    <rect x="540" y="80" width="180" height="80" rx="8" fill="url(#ch)"/>
    <text x="630" y="105" text-anchor="middle" fill="white" font-weight="bold">m4-s1r2</text>
    <text x="630" y="125" text-anchor="middle" fill="white" font-size="11">just restarted</text>
    <text x="630" y="145" text-anchor="middle" fill="white" font-size="11">
      <animate attributeName="opacity" values="1;1;0;0" dur="6s" repeatCount="indefinite"/>
      parts: 2M rows
    </text>
    <text x="630" y="145" text-anchor="middle" fill="white" font-size="11" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1" dur="6s" repeatCount="indefinite"/>
      parts: 2.5M rows ✓
    </text>
  </g>

  <!-- ZK in middle -->
  <g>
    <rect x="290" y="200" width="180" height="60" rx="8" fill="#7c3aed"/>
    <text x="380" y="226" text-anchor="middle" fill="white">ZooKeeper</text>
    <text x="380" y="245" text-anchor="middle" fill="white" font-size="11">/replicas/m4-s1r2/queue</text>
  </g>

  <!-- Static path from r1 → ZK and ZK → r2 -->
  <line x1="220" y1="120" x2="290" y2="220" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>
  <line x1="470" y1="220" x2="540" y2="120" stroke="#94a3b8" stroke-width="1" stroke-dasharray="4 3"/>

  <!-- Queue indicator: rectangles that disappear -->
  <g transform="translate(290,290)">
    <text x="90" y="-2" text-anchor="middle" fill="#0f172a" font-size="11">queue depth</text>
    <rect x="0"   y="0" width="32" height="20" fill="#dc2626" stroke="#0f172a">
      <animate attributeName="opacity" values="1;1;0" dur="6s" begin="0.0s" repeatCount="indefinite"/>
    </rect>
    <rect x="36"  y="0" width="32" height="20" fill="#dc2626" stroke="#0f172a">
      <animate attributeName="opacity" values="1;1;0" dur="6s" begin="0.4s" repeatCount="indefinite"/>
    </rect>
    <rect x="72"  y="0" width="32" height="20" fill="#dc2626" stroke="#0f172a">
      <animate attributeName="opacity" values="1;1;0" dur="6s" begin="0.8s" repeatCount="indefinite"/>
    </rect>
    <rect x="108" y="0" width="32" height="20" fill="#dc2626" stroke="#0f172a">
      <animate attributeName="opacity" values="1;1;0" dur="6s" begin="1.2s" repeatCount="indefinite"/>
    </rect>
    <rect x="144" y="0" width="32" height="20" fill="#dc2626" stroke="#0f172a">
      <animate attributeName="opacity" values="1;1;0" dur="6s" begin="1.6s" repeatCount="indefinite"/>
    </rect>
  </g>

  <!-- Animated parts moving from r1 → r2 (via ZK metadata + interserver fetch) -->
  <g>
    <circle r="6" fill="#22c55e">
      <animateMotion dur="2s" begin="0s" repeatCount="indefinite"
                     path="M 220 120 Q 380 60 540 120"/>
    </circle>
    <circle r="6" fill="#22c55e">
      <animateMotion dur="2s" begin="0.4s" repeatCount="indefinite"
                     path="M 220 120 Q 380 60 540 120"/>
    </circle>
    <circle r="6" fill="#22c55e">
      <animateMotion dur="2s" begin="0.8s" repeatCount="indefinite"
                     path="M 220 120 Q 380 60 540 120"/>
    </circle>
  </g>

  <text x="380" y="350" text-anchor="middle" fill="#475569" font-size="11">
    Each green dot = one part fetched via interserver port :9009 after ZK notifies the queue.
  </text>
</svg>
