<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ClickHouse Training - Markdown Viewer</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="icon" type="image/png" href="/favicon.png">
    <script src="https://cdn.jsdelivr.net/npm/marked@11.1.1/marked.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
            background: #f5f5f5;
            color: #1a1a1a;
            line-height: 1.6;
        }

        .header {
            background: linear-gradient(135deg, #ff6b35 0%, #f7931e 100%);
            color: white;
            padding: 30px 20px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
        }

        .header h1 {
            font-size: 2em;
            margin-bottom: 10px;
        }

        .nav {
            background: rgba(255, 107, 53, 0.1);
            padding: 15px 20px;
            border-bottom: 2px solid #ff6b35;
        }

        .nav a {
            color: #ff6b35;
            text-decoration: none;
            font-weight: 600;
            padding: 8px 16px;
            border-radius: 6px;
            transition: all 0.3s;
        }

        .nav a:hover {
            background: #ff6b35;
            color: white;
        }

        .container {
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .module-selector {
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            margin-bottom: 30px;
        }

        .module-selector h2 {
            color: #ff6b35;
            margin-bottom: 20px;
        }

        .module-buttons {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 15px;
        }

        .module-btn {
            padding: 15px 20px;
            background: linear-gradient(135deg, #ff6b35, #f7931e);
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.95em;
            font-weight: 600;
            transition: all 0.3s;
        }

        .module-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 107, 53, 0.4);
        }

        #content {
            background: white;
            padding: 40px;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0,0,0,0.1);
            display: none;
        }

        #content.loaded {
            display: block;
        }

        #content h1 {
            color: #ff6b35;
            border-bottom: 3px solid #ff6b35;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        #content h2 {
            color: #ff6b35;
            margin-top: 40px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 2px solid #ffe6dc;
        }

        #content h3 {
            color: #333;
            margin-top: 30px;
            margin-bottom: 15px;
        }

        #content code {
            background: #f0f0f0;
            padding: 2px 6px;
            border-radius: 4px;
            font-family: 'Courier New', monospace;
            font-size: 0.9em;
            color: #e74c3c;
        }

        #content pre {
            background: #1e1e1e;
            color: #d4d4d4;
            padding: 20px;
            border-radius: 8px;
            overflow-x: auto;
            margin: 20px 0;
        }

        #content pre code {
            background: none;
            padding: 0;
            color: #d4d4d4;
        }

        #content blockquote {
            border-left: 4px solid #ff6b35;
            background: #fff9e6;
            padding: 15px 20px;
            margin: 20px 0;
            border-radius: 4px;
        }

        #content table {
            width: 100%;
            border-collapse: collapse;
            margin: 20px 0;
        }

        #content table th {
            background: #ff6b35;
            color: white;
            padding: 12px;
            text-align: left;
        }

        #content table td {
            padding: 12px;
            border-bottom: 1px solid #ddd;
        }

        #content table tr:nth-child(even) {
            background: #f9f9f9;
        }

        #content ul, #content ol {
            margin: 15px 0;
            padding-left: 30px;
        }

        #content li {
            margin: 8px 0;
        }

        #content a {
            color: #ff6b35;
            text-decoration: none;
            border-bottom: 1px solid #ff6b35;
        }

        #content a:hover {
            color: #f7931e;
            border-bottom-color: #f7931e;
        }

        #content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
        }

        .loading {
            text-align: center;
            padding: 60px 20px;
            color: #999;
            font-size: 1.2em;
        }

        .error {
            background: #ffe6e6;
            color: #e74c3c;
            padding: 20px;
            border-radius: 8px;
            border-left: 4px solid #e74c3c;
        }

        @media (max-width: 768px) {
            #content {
                padding: 20px;
            }

            .module-buttons {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>

<div class="header">
    <h1>📝 ClickHouse Training - Quick Guides</h1>
    <p>Concise Notion-style guides with theory and quick references</p>
</div>

<div class="nav">
    <a href="index.html">← Back to Home</a>
</div>

<div class="container">

    <div class="module-selector">
        <h2>Select a Module Guide</h2>
        <div class="module-buttons">
            <button class="module-btn" onclick="loadModule('module-1-fundamentals.md')">📊 Module 1: Fundamentals</button>
            <button class="module-btn" onclick="loadModule('module-2-table-engines.md')">🔧 Module 2: Table Engines</button>
            <button class="module-btn" onclick="loadModule('module-3-sharding.md')">🌍 Module 3: Sharding</button>
            <button class="module-btn" onclick="loadModule('module-4-replication.md')">🔄 Module 4: Replication</button>
            <button class="module-btn" onclick="loadModule('module-5-cluster-deployment.md')">🚀 Module 5: Cluster Deployment</button>
            <button class="module-btn" onclick="loadModule('module-6-query-optimization.md')">⚡ Module 6: Query Optimization</button>
            <button class="module-btn" onclick="loadModule('module-7-backup-recovery.md')">💾 Module 7: Backup & Recovery</button>
            <button class="module-btn" onclick="loadModule('module-8-disaster-recovery.md')">🆘 Module 8: Disaster Recovery</button>
            <button class="module-btn" onclick="loadModule('module-9-kafka-ingestion.md')">📥 Module 9: Kafka Ingestion</button>
            <button class="module-btn" onclick="loadModule('module-10-migration.md')">🔀 Module 10: Migration</button>
        </div>
    </div>

    <div id="content"></div>

</div>

<script>
    // Configure marked for better rendering
    marked.setOptions({
        breaks: true,
        gfm: true,
        headerIds: true,
        mangle: false
    });

    async function loadModule(filename) {
        const contentDiv = document.getElementById('content');
        contentDiv.innerHTML = '<div class="loading">Loading guide...</div>';
        contentDiv.classList.add('loaded');

        try {
            const response = await fetch(`notion-guides/${filename}`);

            if (!response.ok) {
                throw new Error(`Failed to load: ${response.statusText}`);
            }

            const markdown = await response.text();
            const html = marked.parse(markdown);

            contentDiv.innerHTML = html;

            // Scroll to content
            contentDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });

        } catch (error) {
            contentDiv.innerHTML = `
                <div class="error">
                    <h3>⚠️ Error Loading Guide</h3>
                    <p>Could not load <strong>${filename}</strong></p>
                    <p>Error: ${error.message}</p>
                    <p>Make sure the file exists in the <code>notion-guides/</code> directory.</p>
                </div>
            `;
        }
    }

    // Load module from URL parameter if present
    window.addEventListener('DOMContentLoaded', () => {
        const urlParams = new URLSearchParams(window.location.search);
        const module = urlParams.get('module');

        if (module) {
            loadModule(module);
        }
    });
</script>

</body>
</html>
